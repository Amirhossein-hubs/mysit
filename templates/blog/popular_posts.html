{% load humanize %}
{% load static %}
{% load blog_tags %}
<div class="single-sidebar-widget popular-post-widget">
    <h4 class="popular-title">Popular Posts</h4>
    {% for item in posts %}
    <div class="popular-post-list">
        <div class="single-post-list d-flex flex-row align-items-center">
            <div class="thumb">
                <a href="{% url 'blog:single' pid=item.id %}"><img class="img-fluid" src="{{ item.image.url }}" alt="">
            </div>
            <div class="details">
                <a href="{% url 'blog:single' pid=item.id %}">
                    <h6>{{ item.title }}</h6>
                </a>
                <p>{{ item.published_date|naturaltime }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
