{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- start banner Area -->
<section class="relative about-banner">
    <div class="overlay overlay-bg"></div>
    <div class="container">
        <div class="row d-flex align-items-center justify-content-center">
            <div class="about-content col-lg-12">
                <h1 class="text-white">
                    <p>Signup</p>
                </h1>
            </div>
        </div>
    </div>
</section><br><br><br>
<!-- End banner Area -->

<body class="text-center">
    <form class="form-signin" method="post" action="{% url 'accounts:singup' %}">
        {% csrf_token %}
        <img class="mb-4" src="{% static 'img/bootstrap.jpg' %}" alt="" width="72" height="72">
        <h1 class="h3 mb-3 font-weight-normal">please singup</h1>
        <lable for="inputusername">Username:</lable>
        <input type="text" name="username" maxlength="150" autocapitalize="none" autocomplete="username" autofocus=""
             aria-describedby="id_username_helptext" id="id_username" placeholder="username"><br><br>
        <lable for="inputpassword">Password:</lable>
        <input type="password" name="password1" autocomplete="new-password" 
            aria-describedby="id_password1_helptext" id="id_password1" placeholder="Password"><br><br>
        <lable for="inputpassword">Password:</lable>
        <input type="password" name="password2" autocomplete="new-password" 
            aria-describedby="id_password2_helptext" id="id_password2" placeholder="Password"><br><br>
        <div class="checkboxmb-3">
            <lable>
                <input type="checkbox" value="remember-me">Remember me
            </lable>
        </div>
        <button class="btn btn-lg btn-primary btn-blook" type="submit">sign in</button>
        <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
    </form>
</body>
{% endblock %}
